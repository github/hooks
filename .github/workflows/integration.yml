name: integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: [ '3.2.2', '3.2.3', '3.3.0', '3.3.1', '3.4.0', '3.4.2', '3.4.3', '3.4.4' ]

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - uses: ruby/setup-ruby@829114fc20da43a41d27359103ec7a63020954d4 # pin@v1.255.0
        with:
          bundler-cache: true
          ruby-version: ${{ matrix.ruby }}

      - name: bootstrap
        run: script/bootstrap

      - name: integration
        run: script/integration
